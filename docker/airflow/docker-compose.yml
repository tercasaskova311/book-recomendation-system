services:
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB_AIRFLOW}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    networks:

  airflow-webserver:
    image: ${AIRFLOW_IMAGE_NAME}:${AIRFLOW_IMAGE_TAG}
    depends_on:
      - postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB_AIRFLOW}
      - AIRFLOW__WEBSERVER__RBAC=True
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ../../airflow/dags:/opt/airflow/dags
      - ../../airflow/config:/opt/airflow/config
      - ../../spark:/opt/spark_jobs
      - ../../:/opt/project
    ports:
      - "8082:8080"
      #http://localhost:8082/
    command: webserver
    networks:

  airflow-scheduler:
    image: ${AIRFLOW_IMAGE_NAME}:${AIRFLOW_IMAGE_TAG}
    depends_on:
      - postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB_AIRFLOW}
      - PYTHONPATH=/opt/project
      - HF_HOME=/opt/airflow/.cache/huggingface
      - TRANSFORMERS_CACHE=/opt/airflow/.cache/huggingface
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    mem_limit: 8g
    mem_reservation: 4g
    cpus: 2.0
    volumes:
      - ../../:/opt/project
      - ../../airflow/dags:/opt/airflow/dags
      - ../../airflow/config:/opt/airflow/config
      - ../../data:/data
      - ../../.hf-cache:/opt/airflow/.cache/huggingface
    command: scheduler
    networks:

  airflow-init:
    image: ${AIRFLOW_IMAGE_NAME}:${AIRFLOW_IMAGE_TAG}
    depends_on:
      - postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB_AIRFLOW}
    volumes:
      - ../../airflow/dags:/opt/airflow/dags
      - ../../airflow/config:/opt/airflow/config
      - ../../spark:/opt/spark_jobs
      - ../../:/opt/project
    entrypoint: /bin/bash

networks:
  airflow-network:
    driver: bridge

volumes:
  postgres-db-volume: