version: '3.8'

services:
  airflow-init:
    image: ${AIRFLOW_IMAGE_NAME}:${AIRFLOW_IMAGE_TAG}
    container_name: airflow-init
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@book-recs-postgres/${DB_NAME}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    env_file:
      - ../../.env.development
    volumes:
      - ../../airflow/dags:/opt/airflow/dags
      - ../../airflow/config:/opt/airflow/config
      - ../../:/opt/project
    entrypoint: /bin/bash
    command: 
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username ${AIRFLOW_ADMIN_USER:-admin} \
          --password ${AIRFLOW_ADMIN_PASSWORD:-admin} \
          --firstname ${AIRFLOW_ADMIN_USER_FIRSTNAME:-Admin} \
          --lastname ${AIRFLOW_ADMIN_USER_LASTNAME:-User} \
          --role ${AIRFLOW_ADMIN_USER_ROLE:-Admin} \
          --email ${AIRFLOW_ADMIN_USER_EMAIL:-admin@example.com} || true
    networks:
      - book-recs-network
    restart: "no"

  airflow-scheduler:
    image: ${AIRFLOW_IMAGE_NAME}:${AIRFLOW_IMAGE_TAG}
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@book-recs-postgres/${DB_NAME}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - PYTHONPATH=/opt/project
      - DB_HOST=book-recs-postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    env_file:
      - ../../.env.development
    volumes:
      - ../../airflow/dags:/opt/airflow/dags
      - ../../airflow/config:/opt/airflow/config
      - ../../:/opt/project
    command: scheduler
    networks:
      - book-recs-network
    restart: unless-stopped

  airflow-webserver:
    image: ${AIRFLOW_IMAGE_NAME}:${AIRFLOW_IMAGE_TAG}
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@book-recs-postgres/${DB_NAME}
      - AIRFLOW__WEBSERVER__RBAC=True
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    env_file:
      - ../../.env.development
    ports:
      - "8082:8080"
    volumes:
      - ../../airflow/dags:/opt/airflow/dags
      - ../../airflow/config:/opt/airflow/config
      - ../../:/opt/project
    command: webserver
    networks:
      - book-recs-network
    restart: unless-stopped

networks:
  book-recs-network:
    external: true
    name: book-recs-network