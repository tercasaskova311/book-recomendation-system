version: "3.8"

services:
  spark-master:
    build:
      context: ../..
      dockerfile: docker/spark/Dockerfile
    container_name: spark-master
    hostname: spark-master
    env_file:
      - ../../.env.development
    environment:
      - SPARK_MODE=master
      - DB_HOST=book-recs-postgres
      - DB_PORT=5432
    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040-4050"
    volumes:
      - ../../spark:/opt/project/spark:rw
      - ../../common:/opt/project/common:rw
      - ../../delta:/opt/project/delta:rw
      - ../../config.py:/opt/project/config.py:ro
    networks:
      - spark_network
      - postgres_network
    command: >
      bash -c "
      /opt/spark/sbin/start-master.sh &&
      tail -f /dev/null
      "

  spark-worker:
    build:
      context: ../..
      dockerfile: docker/spark/Dockerfile
    container_name: spark-worker
    env_file:
      - ../../.env.development
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4g
      - DB_HOST=book-recs-postgres
      - DB_PORT=5432
    depends_on:
      - spark-master
    volumes:
      - ../../spark:/opt/project/spark:rw
      - ../../common:/opt/project/common:rw
      - ../../delta:/opt/project/delta:rw
      - ../../config.py:/opt/project/config.py:ro
    networks:
      - spark_network
      - postgres_network
    command: >
      bash -c "
      /opt/spark/sbin/start-worker.sh spark://spark-master:7077 &&
      tail -f /dev/null
      "

networks:
  spark_network:
    driver: bridge
  postgres_network:
    external: true
    name: postgres_postgres_network

