version: '3.8'

services:
  spark-master:
    build:
      context: ../..
      dockerfile: docker/spark/Dockerfile
    container_name: spark_master
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - spark_network

volumes:
  spark_data:

networks:
  spark_network:
    driver: bridge