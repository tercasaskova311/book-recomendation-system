version: '3.8'

services:
  spark-master:
    build:
      context: ../..
      dockerfile: docker/spark/Dockerfile
    container_name: spark-master
    hostname: spark-master
    environment:
      - SPARK_MODE=master
      - DB_HOST=host.docker.internal
      - DB_PORT=${DB_PORT:-5060}
      - DB_NAME=${DB_NAME:-book_recommendations}
      - DB_USER=${DB_USER:-terezasaskova}
      - DB_PASSWORD=${DB_PASSWORD:-}
    ports:
      - "8080:8080"  # Spark UI
      - "7077:7077"  # Spark master
      - "4040:4040"  # Application UI
    volumes:
      - ../../spark:/opt/project/spark:rw
      - ../../common:/opt/project/common:rw
      - ../../delta:/opt/project/delta:rw
      - ../../config.py:/opt/project/config.py:ro
      - ../../.env.development:/opt/project/.env.development:ro
      - ../../ingestion/fetching_data.py:/opt/project/fetching_data.py:ro
    networks:
      - spark_network
    command: /opt/spark/sbin/start-master.sh && tail -f /opt/spark/logs/spark*.out

  spark-worker:
    build:
      context: ../..
      dockerfile: docker/spark/Dockerfile
    container_name: spark-worker
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4g
    depends_on:
      - spark-master
    volumes:
      - ../../spark:/opt/project/spark:rw
      - ../../common:/opt/project/common:rw
      - ../../delta:/opt/project/delta:rw
    networks:
      - spark_network
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /opt/spark/logs/spark*.out

volumes:
  spark_data:

networks:
  spark_network:
    driver: bridge