version: '3.8'

services:
  dashboard:
    build:
      context: ../..
      dockerfile: docker/dashboard/Dockerfile
    container_name: dashboard
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    volumes:
      - ../../app:/app/app
      - ../../common:/app/common
      - ../../delta:/app/delta
      - ../../config.py:/app/config.py
      - ../../.env.development:/app/.env.development
      - ../../ingestion:/app/ingestion 
      - ../../data:/app/data           
    environment:
      - DB_HOST=${DB_HOST:-book-recs-postgres}
      - DB_PORT=5433
      - DB_NAME=${DB_NAME:-book_recommendations}
      - DB_USER=${DB_USER:-terezasaskova}
      - DB_PASSWORD=${DB_PASSWORD:-}
    networks:
      - dashboard_network
      - postgres_network
    working_dir: /app
    command: streamlit run app/dashboard.py --server.port=8501 --server.address=0.0.0.0

networks:
  postgres_network:
    external: true
    name: postgres_postgres_network
  dashboard_network:
    driver: bridge
