version: '3.8'

services:
  airflow-init:
    build:
      context: ../..
      dockerfile: docker/airflow/Dockerfile
    container_name: airflow-init
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-terezasaskova}:${POSTGRES_PASSWORD:-airflow123}@host.docker.internal:${DB_PORT:-5060}/${POSTGRES_DB_AIRFLOW:-airflow}
      - AIRFLOW__CORE__FERNET_KEY=''
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_ADMIN_USER_EMAIL:-admin}
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    networks:
      - airflow_network
    command: version

  airflow-webserver:
    build:
      context: ../..
      dockerfile: docker/airflow/Dockerfile
    container_name: airflow-webserver
    depends_on:
      - airflow-init
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-terezasaskova}:${POSTGRES_PASSWORD:-airflow123}@host.docker.internal:${DB_PORT:-5060}/${POSTGRES_DB_AIRFLOW:-airflow}
      - AIRFLOW__CORE__FERNET_KEY=''
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      # Database connection for DAGs
      - DB_HOST=host.docker.internal
      - DB_PORT=${DB_PORT:-5060}
      - DB_NAME=${DB_NAME:-book_recommendations}
      - DB_USER=${DB_USER:-terezasaskova}
      - DB_PASSWORD=${DB_PASSWORD:-}
      # Google API
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    ports:
      - "${AIRFLOW_PORT:-8081}:8080"
    volumes:
      - ../../airflow/dags:/opt/airflow/dags
      - ../../airflow/config:/opt/airflow/config
      - ../../spark:/opt/project/spark
      - ../../common:/opt/project/common
      - ../../config.py:/opt/project/config.py
      - ../../fetching_data.py:/opt/project/fetching_data.py
      - ../../.env.development:/opt/project/.env.development
      - airflow_logs:/opt/airflow/logs
    networks:
      - airflow_network
    command: webserver

  airflow-scheduler:
    build:
      context: ../..
      dockerfile: docker/airflow/Dockerfile
    container_name: airflow-scheduler
    depends_on:
      - airflow-webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-terezasaskova}:${POSTGRES_PASSWORD:-airflow123}@host.docker.internal:${DB_PORT:-5060}/${POSTGRES_DB_AIRFLOW:-airflow}
      - AIRFLOW__CORE__FERNET_KEY=''
      - DB_HOST=host.docker.internal
      - DB_PORT=${DB_PORT:-5060}
      - DB_NAME=${DB_NAME:-book_recommendations}
      - DB_USER=${DB_USER:-terezasaskova}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ../../airflow/dags:/opt/airflow/dags
      - ../../airflow/config:/opt/airflow/config
      - ../../spark:/opt/project/spark
      - ../../common:/opt/project/common
      - ../../config.py:/opt/project/config.py
      - ../../fetching_data.py:/opt/project/fetching_data.py
      - ../../.env.development:/opt/project/.env.development
      - airflow_logs:/opt/airflow/logs
    networks:
      - airflow_network
    command: scheduler

volumes:
  airflow_logs:

networks:
  airflow_network:
    driver: bridge