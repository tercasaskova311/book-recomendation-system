version: '3.8'

services:
  streamlit:
    build:
      context: ../..
      dockerfile: docker/streamlit/Dockerfile
    container_name: streamlit_app
    ports:
      - "8501:8501"
    volumes:
      - ../../src:/app
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
    networks:
      - streamlit_network

networks:
  streamlit_network:
    driver: bridge